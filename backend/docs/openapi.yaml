openapi: 3.0.3
info:
  title: Kanban API
  version: 1.0.0
  description: Documentation of the kanban backend API.

paths:
  # ==========================================
  # MODULE AUTH
  # ==========================================
  /api/v1/auth/register:
    post:
      summary: Registering a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Utilisateur créé avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResponse'
        '400':
          description: Données invalides (Erreur de validation Zod).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Invalid request
                  details:
                    email: ["Invalid email address"]
        '409':
          description: Conflit (L'email existe déjà).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error:
                  code: EMAIL_ALREADY_IN_USE
                  message: This email is already used by another account.
                  details:
                    email: ["This email is already in use"]

  /api/v1/auth/login:
    post:
      summary: Connexion d'un utilisateur
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Connexion réussie, tokens injectés dans les cookies (HttpOnly).
          headers:
            Set-Cookie:
              description: accessToken (15m) et refreshToken (7j)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Format des données invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Identifiants invalides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid credentials.

  /api/v1/auth/refresh:
    post:
      summary: Rafraîchir les tokens de session
      description: Nécessite le cookie refreshToken valide.
      tags:
        - Auth
      responses:
        '200':
          description: Session rafraîchie, nouveaux tokens injectés.
          headers:
            Set-Cookie:
              description: Nouveaux accessToken et refreshToken
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          description: Session inexistante ou expirée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              example:
                error:
                  code: SESSION_EXPIRED
                  message: Session expired, please sign in again.

  /api/v1/auth/me:
    get:
      summary: Récupérer le profil de l'utilisateur connecté
      description: Nécessite un cookie accessToken valide.
      tags:
        - Auth
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Profil récupéré avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Non authentifié (Token manquant ou expiré).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    patch:
      summary: Mettre à jour le profil de l'utilisateur connecté
      description: >
        Mise à jour partielle. Seuls `name` et `email` sont modifiables ;
        tout autre champ est rejeté (400). Au moins un champ est requis.
      tags:
        - Auth
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserDto'
      responses:
        '200':
          description: Profil mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          description: Données invalides (détail par champ dans `details`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Invalid request
                  details:
                    email: ["Invalid email address"]
        '401':
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Utilisateur introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '409':
          description: Email déjà utilisé par un autre compte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error:
                  code: EMAIL_ALREADY_IN_USE
                  message: This email is already used by another account.
                  details:
                    email: ["This email is already in use"]

  /api/v1/auth/me/stats:
    get:
      summary: Statistiques d'activité de l'utilisateur connecté
      description: Nombre de projets possédés et de tâches dans ces projets, par statut.
      tags:
        - Auth
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Statistiques récupérées.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserActivityStats'
        '401':
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /api/v1/auth/me/export:
    get:
      summary: Exporter les données de l'utilisateur connecté (CSV ou JSON)
      description: >
        Télécharge les projets possédés par l'utilisateur, avec leurs tableaux
        et leurs tâches, en CSV (UTF-8 avec BOM, une ligne par tâche) ou en JSON
        (projet → tableaux → tâches). Les personnes ne
        sont jamais exportées par nom ou email, uniquement par leur rôle dans
        le projet (`owner` ou `member`). Format détaillé :
        `docs/backend/DATA_EXPORT.md`.
      tags:
        - Auth
      security:
        - CookieAuth: []
      parameters:
        - name: format
          in: query
          required: false
          description: Type de fichier.
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - name: layout
          in: query
          required: false
          description: >
            `single` = un seul fichier ; `per-project` = une archive ZIP
            contenant un fichier par projet.
          schema:
            type: string
            enum: [single, per-project]
            default: single
        - name: projectIds
          in: query
          required: false
          description: >
            Identifiants de projets possédés, séparés par des virgules (100 max).
            Absent = tous les projets possédés.
          schema:
            type: string
            example: 8e1f1945-743b-44e3-b05a-6950e0cdd08b,fd60fd33-51fb-427b-b307-4512fb3f22d8
      responses:
        '200':
          description: Fichier d'export (pièce jointe, non mis en cache).
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="kanban-export-2026-09-28.csv"
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: >
            Paramètres invalides (`VALIDATION_ERROR`) ou aucun projet à exporter
            (`NOTHING_TO_EXPORT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: >
            Un projet sélectionné est introuvable ou n'appartient pas à
            l'utilisateur (`PROJECT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /api/v1/auth/logout:
    post:
      summary: Déconnexion de l'utilisateur
      description: Invalide le refresh token en base et efface les cookies de session.
      tags:
        - Auth
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Déconnexion réussie, cookies effacés.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Déconnexion réussie
        '401':
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  # ==========================================
  # MODULE PROJECTS
  # ==========================================
  /api/v1/projects:
    get:
      summary: Liste tous les projets de l'utilisateur connecté
      tags:
        - Projects
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Liste des projets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Crée un nouveau projet
      tags:
        - Projects
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectDto'
      responses:
        '201':
          description: Projet créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Données invalides (Zod)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/v1/projects/{projectId}:
    get:
      summary: Récupère un projet spécifique
      tags:
        - Projects
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Projet trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      summary: Met à jour un projet
      tags:
        - Projects
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectDto'
      responses:
        '200':
          description: Projet mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Données invalides (Zod)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      summary: Supprime un projet
      tags:
        - Projects
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Projet supprimé avec succès
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/projects/{projectId}/members:
    get:
      summary: Liste les membres d'un projet (hors propriétaire)
      tags:
        - Projects
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Liste des membres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    post:
      summary: Ajoute un membre au projet (lecture seule) par email
      description: Réservé au propriétaire du projet.
      tags:
        - Projects
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectMemberDto'
      responses:
        '201':
          description: Membre ajouté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
        '400':
          description: Données invalides (Zod)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Projet introuvable, ou aucun utilisateur avec cet email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '409':
          description: >
            L'utilisateur est déjà le propriétaire ou déjà membre du projet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /api/v1/projects/{projectId}/members/{memberUserId}:
    patch:
      summary: Change le rôle d'un membre (VIEWER ou EDITOR)
      description: Réservé au propriétaire du projet.
      tags:
        - Projects
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: memberUserId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/ProjectRole'
      responses:
        '200':
          description: Rôle mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      summary: Retire un membre du projet
      description: Réservé au propriétaire du projet.
      tags:
        - Projects
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: memberUserId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Membre retiré avec succès
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/projects/{projectId}/team:
    get:
      summary: Propriétaire et membres du projet avec nom et email
      description: Propriétaire ou membre. Sert à afficher l'équipe et à choisir l'assigné d'une tâche.
      tags:
        - Projects
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Équipe du projet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectTeam'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/projects/{projectId}/invitations:
    get:
      summary: Invitations en attente du projet
      description: Réservé au propriétaire du projet.
      tags:
        - Invitations
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invitations en attente, plus anciennes en premier
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectInvitation'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    post:
      summary: Invite un utilisateur (par email) à rejoindre le projet
      description: >
        Réservé au propriétaire. L'utilisateur devient membre (lecture seule)
        seulement après avoir accepté l'invitation.
      tags:
        - Invitations
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: '#/components/schemas/ProjectRole'
      responses:
        '201':
          description: Invitation créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInvitation'
        '400':
          description: Email invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Projet introuvable (NOT_FOUND) ou aucun utilisateur avec cet email (USER_NOT_FOUND)
        '409':
          description: Déjà propriétaire (ALREADY_OWNER), déjà membre (ALREADY_MEMBER) ou déjà invité (ALREADY_INVITED)

  /api/v1/projects/{projectId}/invitations/{invitationId}:
    delete:
      summary: Annule une invitation en attente
      description: Réservé au propriétaire du projet.
      tags:
        - Invitations
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invitation annulée
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Projet ou invitation introuvable

  /api/v1/invitations:
    get:
      summary: Invitations reçues par l'utilisateur connecté
      tags:
        - Invitations
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Invitations en attente, plus récentes en premier
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectInvitation'

  /api/v1/invitations/{invitationId}/accept:
    post:
      summary: Accepte une invitation et rejoint le projet comme membre
      tags:
        - Invitations
      security:
        - CookieAuth: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invitation acceptée
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId:
                    type: string
                    format: uuid
        '404':
          description: Invitation introuvable ou adressée à un autre utilisateur (INVITATION_NOT_FOUND)

  /api/v1/invitations/{invitationId}/decline:
    post:
      summary: Refuse une invitation
      tags:
        - Invitations
      security:
        - CookieAuth: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invitation refusée
        '404':
          description: Invitation introuvable ou adressée à un autre utilisateur (INVITATION_NOT_FOUND)

  # ==========================================
  # MODULE BOARDS
  # ==========================================
  /api/v1/projects/{projectId}/boards:
    get:
      summary: Liste tous les tableaux (boards) d'un projet
      tags:
        - Boards
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Liste des boards du projet
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Board'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    post:
      summary: Crée un tableau (board) dans un projet
      tags:
        - Boards
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardDto'
      responses:
        '201':
          description: Board créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          description: Données invalides (Zod)
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/boards/{boardId}:
    patch:
      summary: Met à jour un tableau (board)
      tags:
        - Boards
      security:
        - CookieAuth: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoardDto'
      responses:
        '200':
          description: Board mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          description: Données invalides (Zod)
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      summary: Supprime un tableau (board)
      tags:
        - Boards
      security:
        - CookieAuth: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Board supprimé avec succès
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==========================================
  # MODULE TASKS
  # ==========================================
  /api/v1/projects/{projectId}/tasks:
    get:
      summary: Récupère toutes les tâches d'un projet
      tags:
        - Tasks
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Liste des tâches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    post:
      summary: Crée une tâche dans un projet
      tags:
        - Tasks
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskDto'
      responses:
        '201':
          description: Tâche créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Données invalides (Zod), assigné non membre du projet, ou board d'un autre projet (BOARD_NOT_IN_PROJECT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/tasks/my:
    get:
      summary: Tâches assignées à l'utilisateur connecté, tous projets confondus
      description: >
        Page "My tasks". Ne renvoie que les tâches des projets dont
        l'utilisateur est propriétaire ou membre : une tâche restée assignée
        après le retrait du projet n'apparaît plus. Tri par échéance la plus
        proche, les tâches sans échéance en dernier, puis par date de
        création.
      tags:
        - Tasks
      security:
        - CookieAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [TODO, IN_PROGRESS, DONE]
      responses:
        '200':
          description: Tâches assignées avec leur projet.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Task'
                    - type: object
                      properties:
                        assigneeId:
                          type: string
                          format: uuid
                          nullable: true
                        project:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
        '400':
          description: Paramètre de requête invalide ou inconnu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /api/v1/tasks/{taskId}:
    patch:
      summary: Met à jour une tâche (statut, titre, boardId, assignation...)
      tags:
        - Tasks
      security:
        - CookieAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskDto'
      responses:
        '200':
          description: Tâche mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Données invalides (Zod), assigné non membre du projet, ou board d'un autre projet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                validation:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Invalid request
                      details:
                        assigneeId: ["Invalid UUID"]
                notAMember:
                  value:
                    error:
                      code: ASSIGNEE_NOT_PROJECT_MEMBER
                      message: The selected user is not a member of this task's project.
                boardNotInProject:
                  value:
                    error:
                      code: BOARD_NOT_IN_PROJECT
                      message: The selected board does not belong to this task's project.
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      summary: Supprime une tâche
      tags:
        - Tasks
      security:
        - CookieAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Tâche supprimée
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==========================================
  # MODULE ADMIN
  # ==========================================
  # Every route below requires requireAuth + requireAdmin — a system-wide
  # role check, independent of ProjectAccessGuard's per-project
  # owner/member authorization. See
  # docs/standards/API_CONVENTIONS.md#admin-dashboard-endpoints.
  /api/v1/admin/tasks:
    get:
      summary: Liste toutes les tâches de tous les projets, groupées par projet
      description: >
        Vue globale admin, non filtrée par appartenance/rôle projet. Chaque
        groupe inclut assignableUsers (propriétaire + membres) pour permettre
        l'assignation sans requête supplémentaire.
      tags:
        - Admin
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Tâches groupées par projet
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProjectTasks'
        '401':
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          description: Authentifié mais non administrateur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              example:
                error:
                  code: FORBIDDEN
                  message: This action requires administrator access.

  /api/v1/admin/tasks/{taskId}/assignee:
    patch:
      summary: Assigne (ou désassigne) une tâche à un utilisateur
      description: >
        L'utilisateur cible doit déjà avoir accès au projet de la tâche
        (propriétaire ou ProjectMember) ; sinon 400
        ASSIGNEE_NOT_PROJECT_MEMBER. Ajoutez d'abord l'utilisateur comme
        membre via POST /projects/{projectId}/members.
      tags:
        - Admin
      security:
        - CookieAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTaskDto'
      responses:
        '200':
          description: Tâche mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: >
            Données invalides (Zod), ou utilisateur cible non membre du
            projet (ASSIGNEE_NOT_PROJECT_MEMBER).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                validation:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Invalid request
                      details:
                        assigneeId: ["Invalid UUID"]
                notAMember:
                  value:
                    error:
                      code: ASSIGNEE_NOT_PROJECT_MEMBER
                      message: The selected user is not a member of this task's project.
        '401':
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          description: Authentifié mais non administrateur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              example:
                error:
                  code: FORBIDDEN
                  message: This action requires administrator access.
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==========================================
  # NOTIFICATIONS
  # ==========================================
  /api/v1/notifications:
    get:
      summary: Liste les notifications de l'utilisateur connecté
      description: >
        Uniquement les notifications de l'utilisateur authentifié, des plus
        récentes aux plus anciennes, paginées par curseur.
      tags:
        - Notifications
      security:
        - CookieAuth: []
      parameters:
        - name: unread
          in: query
          description: Ne renvoyer que les notifications non lues.
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Valeur `nextCursor` de la page précédente.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Une page de notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          description: Paramètres invalides (`VALIDATION_ERROR`) ou curseur inconnu (`INVALID_CURSOR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /api/v1/notifications/unread-count:
    get:
      summary: Nombre de notifications non lues
      tags:
        - Notifications
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Nombre de notifications non lues.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
        '401':
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /api/v1/notifications/{notificationId}/read:
    patch:
      summary: Marque une notification comme lue
      description: >
        Idempotent : une notification déjà lue garde sa date de lecture.
        La notification d'un autre utilisateur répond 404.
      tags:
        - Notifications
      security:
        - CookieAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: La notification mise à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Notification introuvable ou appartenant à un autre utilisateur (`NOTIFICATION_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /api/v1/notifications/read-all:
    post:
      summary: Marque toutes les notifications de l'utilisateur comme lues
      tags:
        - Notifications
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Nombre de notifications marquées comme lues.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
        '401':
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  # ==========================================
  # HEALTH
  # ==========================================
  /api/v1/health:
    get:
      summary: État du backend et de ses dépendances (PostgreSQL, RabbitMQ)
      description: >
        Public, sans authentification. `degraded` signifie que l'API fonctionne
        mais que le broker est injoignable (les traitements asynchrones sont
        retardés). N'expose ni URL ni message d'erreur du broker.
      tags:
        - Health
      responses:
        '200':
          description: Base disponible (`status` vaut `ok` ou `degraded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Base de données indisponible (`status` vaut `down`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [task.created, task.completed, task.assigned, task.updated]
          description: >
            task.created / task.completed : tout le projet ; task.assigned :
            la personne assignée ; task.updated : la personne assignée à la
            tâche modifiée (jamais l'auteur de l'action).
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: Date de l'événement à l'origine de la notification.
        project:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        task:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
              nullable: true
              description: Titre au moment de l'événement.
        actor:
          type: object
          nullable: true
          description: Utilisateur à l'origine de l'événement, null s'il a été supprimé.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        changes:
          type: array
          items:
            type: string
            enum: [title, description, status, priority, deadline, boardId, assigneeId]
          description: Champs modifiés (task.updated uniquement, vide sinon).

    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          type: string
          format: uuid
          nullable: true
          description: À passer en `cursor` pour la page suivante, null sur la dernière page.

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        database:
          type: string
          enum: [up, down]
        rabbitmq:
          type: object
          properties:
            state:
              type: string
              enum: [disabled, connecting, connected, disconnected, closed]
            connectedAt:
              type: string
              format: date-time
            reconnectAttempt:
              type: integer
    # --- AUTHENTICATION SCHEMAS ---
    RegisterRequest:
      type: object
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        name:
          type: string
          minLength: 2
          example: John Doe
        password:
          type: string
          minLength: 8
          example: SuperSecurePassword123

    RegisterSuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: Compte créé avec succès
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            name:
              type: string
            createdAt:
              type: string
              format: date-time

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          example: SuperSecurePassword123

    AuthSuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: Opération réussie
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            name:
              type: string

    # --- DOMAIN ENTITIES ---
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        ownerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        boards:
          type: array
          items:
            $ref: '#/components/schemas/Board'
          description: Liste des tableaux liés (peut être omis si non peuplé)

    ProjectRole:
      type: string
      enum: [VIEWER, EDITOR]
      default: VIEWER
      description: >
        VIEWER lit le projet ; EDITOR gère aussi ses boards et ses tâches.
        Le propriétaire a toujours tous les droits.

    ProjectMember:
      type: object
      description: >
        Access grant with a role; the owner is not duplicated here (see
        Project.ownerId).
      properties:
        role:
          $ref: '#/components/schemas/ProjectRole'
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ProjectTeam:
      type: object
      properties:
        owner:
          type: object
          nullable: true
          properties:
            userId:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
        members:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Id du ProjectMember
              userId:
                type: string
                format: uuid
              name:
                type: string
              email:
                type: string
                format: email
              joinedAt:
                type: string
                format: date-time
              role:
                $ref: '#/components/schemas/ProjectRole'

    ProjectInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        role:
          $ref: '#/components/schemas/ProjectRole'
        project:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        invitee:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
        inviter:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string

    Board:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        projectId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
        priority:
          type: string
          enum: [Low, Medium, High]
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
          nullable: true
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Set via PATCH /tasks/{taskId} (project owner) or
            PATCH /admin/tasks/{taskId}/assignee (admin).

    # --- ADMIN DASHBOARD ---
    AdminAssignableUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email

    AdminTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
        priority:
          type: string
          enum: [Low, Medium, High]
        deadline:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        boardId:
          type: string
          format: uuid
          nullable: true
        assigneeId:
          type: string
          format: uuid
          nullable: true
        assigneeName:
          type: string
          nullable: true
        assigneeEmail:
          type: string
          format: email
          nullable: true

    AdminProjectTasks:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        assignableUsers:
          type: array
          items:
            $ref: '#/components/schemas/AdminAssignableUser'
          description: Project owner + members — the only valid assignment targets.
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/AdminTask'

    AssignTaskDto:
      type: object
      additionalProperties: false
      required: [assigneeId]
      properties:
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: null clears the assignment.

    # --- DTOs ---
    CreateProjectDto:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          default: ""

    UpdateProjectDto:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000

    AddProjectMemberDto:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email

    CreateBoardDto:
      type: object
      required: [name]
      properties:
        name:
          type: string

    UpdateBoardDto:
      type: object
      properties:
        name:
          type: string

    CreateTaskDto:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          default: ""
        status:
          description: >
            Normally omitted — new tasks start in TODO. Accepted for
            completeness/defense-in-depth if a client sends it explicitly.
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
          default: TODO
        priority:
          type: string
          enum: [Low, Medium, High]
          default: Medium
        deadline:
          type: string
          format: date-time
          nullable: true
        boardId:
          type: string
          format: uuid
          nullable: true
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: Propriétaire ou membre du projet.

    UpdateTaskDto:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
        priority:
          type: string
          enum: [Low, Medium, High]
        description:
          type: string
          maxLength: 5000
        deadline:
          type: string
          format: date-time
          nullable: true
        boardId:
          type: string
          format: uuid
          nullable: true
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: >-
            null désassigne la tâche. L'utilisateur doit être owner ou membre
            du projet, sinon 400 ASSIGNEE_NOT_PROJECT_MEMBER.

    # --- ERRORS ---
    # Every error response uses one of the two shapes below (never a bare
    # string), matching docs/standards/API_CONVENTIONS.md §8.
    StandardError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    ValidationError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              description: Messages d'erreur indexés par nom de champ.
              additionalProperties:
                type: array
                items:
                  type: string

    # --- CURRENT USER ---
    CurrentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
          description: >
            System-wide role, orthogonal to per-project ownership/membership.
            See docs/backend/ADMIN_ROLE.md.
        createdAt:
          type: string
          format: date-time

    UpdateCurrentUserDto:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com

    UserActivityStats:
      type: object
      properties:
        projectCount:
          type: integer
          example: 3
        taskCount:
          type: integer
          example: 12
        tasksByStatus:
          type: object
          additionalProperties:
            type: integer
          example:
            TODO: 5
            IN_PROGRESS: 4
            DONE: 3

  responses:
    ForbiddenError:
      description: Accès refusé (Droits insuffisants)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
          example:
            error:
              code: "FORBIDDEN"
              message: "You are not authorized to access this resource."

    NotFoundError:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
          example:
            error:
              code: "NOT_FOUND"
              message: "The requested resource could not be found."