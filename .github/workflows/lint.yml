name: Lint & Format Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  format-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend

  format-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run format:check
        working-directory: backend

  typecheck-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend

  typecheck-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # Prisma client types are generated, not committed (see .gitignore),
      # so type-checking needs a client to check against. `prisma generate`
      # only reads the schema and does not connect to a database, so a
      # placeholder DATABASE_URL is enough to satisfy prisma.config.ts.
      - run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: 'postgresql://user:password@localhost:5432/kanban_ci'
      - run: npm run typecheck
        working-directory: backend

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # Prisma client is generated, not committed (see .gitignore); some
      # tests import it at runtime (e.g. PrismaTaskRepository.test.ts), not
      # just for types, so it must exist before running the suite.
      - run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: 'postgresql://user:password@localhost:5432/kanban_ci'
      - run: npm run test:coverage
        working-directory: backend

  # Real PostgreSQL + RabbitMQ suite (docs/backend/INTEGRATION_TESTS.md).
  integration-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: kanban_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: integration
          RABBITMQ_DEFAULT_PASS: integration
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      # Throwaway service credentials, only reachable from this job.
      DATABASE_URL: postgresql://integration:integration@localhost:5432/kanban_integration_test
      INTEGRATION_DATABASE_URL: postgresql://integration:integration@localhost:5432/kanban_integration_test
      INTEGRATION_RABBITMQ_URL: amqp://integration:integration@localhost:5672/%2F
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend

  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # SonarQube needs the full git history for PR/blame analysis.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # See test-backend: the Prisma client isn't committed, and some tests
      # import it at runtime, not just for types.
      - run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: 'postgresql://user:password@localhost:5432/kanban_ci'
      # Regenerate the backend coverage report so Sonar can pick up
      # sonar.javascript.lcov.reportPaths from sonar-project.properties.
      - run: npm run test:coverage
        working-directory: backend
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Fails the job (and therefore the PR check) when the Quality Gate,
      # configured in SonarQube Cloud to evaluate New Code only, does not
      # pass. See docs/quality-gate.md for the gate configuration.
      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}