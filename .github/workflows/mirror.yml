name: Mirror main branch to Epitech repo

on:
  push:
    branches:
      - main

concurrency: mirror-secondary
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LEGACY_MIRROR_KEY }}

      - name: Push main branch to Epitech repo
        env:
          TARGET_REPO: git@github.com:PLACEHOLDER.git
          DEST_BRANCH: master
        run: |
          git push "$TARGET_REPO" "HEAD:refs/heads/$DEST_BRANCH"