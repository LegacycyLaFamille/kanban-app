name: Docker Healthcheck

on:
  pull_request:
    branches: [Dev, main]
  push:
    branches: [Dev, main]
  workflow_dispatch:

concurrency:
  group: docker-healthcheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # compose.yaml requires RabbitMQ and Grafana passwords; the CI stack is
      # throwaway, so a random one per run avoids storing a secret.
      - name: Generate throwaway credentials
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "RABBITMQ_PASSWORD=$password" >> "$GITHUB_ENV"
          grafana_password="$(openssl rand -hex 24)"
          echo "::add-mask::$grafana_password"
          echo "GRAFANA_ADMIN_PASSWORD=$grafana_password" >> "$GITHUB_ENV"

      - name: Build & wait for healthcehecks
        run: |
          docker compose build
          docker compose up -d --wait --wait-timeout 180

      - name: Show status
        run: docker compose ps

      - name: Smoke test through the nginx proxy
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/ -o /dev/null
          # Write and read through nginx → backend → PostgreSQL: create an
          # account, sign in with it, and check the session cookies.
          email="ci-smoke-$(date +%s)@example.com"
          curl -fsS -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"CI smoke\",\"email\":\"$email\",\"password\":\"ci-smoke-password\"}" \
            -o /dev/null
          curl -fsS -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"ci-smoke-password\"}" \
            -D - -o /dev/null | grep -i '^set-cookie: accessToken=' > /dev/null
          # Protected routes refuse a request without session.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/projects)" = 401
          curl -fsS http://localhost:8080/grafana/api/health -o /dev/null

      - name: Backend connected to PostgreSQL and RabbitMQ
        run: |
          set -euo pipefail
          # The broker connection is opened in the background after startup.
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/v1/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          curl -sS http://localhost:8080/api/v1/health
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans