# SonarQube Cloud configuration for the kanban-app monorepo.
# Full policy (New Code period, gate conditions, legacy rationale) is
# documented in docs/quality-gate.md — keep the two in sync.

sonar.projectKey=LegacycyLaFamille_kanban-app
sonar.organization=legacycylafamille

sonar.projectName=Kanban App

# Single logical project covering both workspaces rather than two Sonar
# projects: this is a small monorepo, PRs frequently touch both sides,
# and a single Quality Gate/New-Code-period is simpler to reason about
# than keeping two in sync.
sonar.sources=frontend/src,backend/src
sonar.tests=frontend/src,backend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# --- Legacy exclusions ---------------------------------------------------
# frontend/src/app/legacy/** and backend/src/legacy/** hold pre-migration,
# CommonJS-era code that is intentionally kept as-is while the rewrite in
# docs/architecture/FRONTEND_MIGRATION.md / BACKEND_MIGRATION.md is in
# progress. They are excluded from SonarQube analysis entirely: this is a
# deliberate, scoped, temporary decision (not "ignore everything"), limited
# to these two directories, and it should be narrowed as each legacy module
# is migrated rather than lifted all at once.
#
# Build output, generated code, and dependencies are excluded for the
# unrelated, permanent reason that they are not source we own.
sonar.exclusions=frontend/src/app/legacy/**,backend/src/legacy/**,**/dist/**,**/node_modules/**,backend/src/generated/**

# Coverage should not be expected from legacy code or test files themselves.
sonar.coverage.exclusions=frontend/src/app/legacy/**,backend/src/legacy/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Backend coverage report, produced by `npm run test:coverage`
# (see backend/vitest.config.ts). Frontend has no tests yet; add
# sonar.javascript.lcov.reportPaths entries for it once it does.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
