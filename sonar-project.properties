# SonarQube Cloud configuration for the kanban-app monorepo.
# Full policy (New Code period, gate conditions) is
# documented in docs/quality-gate.md — keep the two in sync.

sonar.projectKey=LegacycyLaFamille_kanban-app
sonar.organization=legacycylafamille

sonar.projectName=Kanban App

# Single logical project covering both workspaces rather than two Sonar
# projects: this is a small monorepo, PRs frequently touch both sides,
# and a single Quality Gate/New-Code-period is simpler to reason about
# than keeping two in sync.
sonar.sources=frontend/src,backend/src
sonar.tests=frontend/src,backend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# --- Exclusions ----------------------------------------------------------
# Build output, generated code and dependencies are not source we own. The
# legacy TodoList and its exclusions were removed with ADR-011: every source
# file is analysed.
sonar.exclusions=**/dist/**,**/node_modules/**,backend/src/generated/**

# Coverage is not expected from the test files themselves.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,backend/src/tests/**

# Backend coverage report, produced by `npm run test:coverage`
# (see backend/vitest.config.ts). Frontend has no tests yet; add
# sonar.javascript.lcov.reportPaths entries for it once it does.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
