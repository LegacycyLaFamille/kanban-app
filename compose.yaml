include:
  - path:
      - docker/observability/compose.yaml
      - docker/observability/compose.deploy.yaml

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kanban_user}:${POSTGRES_PASSWORD:-kanban_password}@postgres:5432/${POSTGRES_DB:-kanban_db}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      - OTEL_SERVICE_NAME=kanban-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRIC_EXPORT_INTERVAL=15000
      - OTEL_SEMCONV_STABILITY_OPT_IN=http
      - SQLITE_DB_LOCATION=/data/todo.db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-kanban}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
    volumes:
      - backend-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-kanban_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kanban_password}
      - POSTGRES_DB=${POSTGRES_DB:-kanban_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban_user} -d ${POSTGRES_DB:-kanban_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # RabbitMQ stores its data under a directory named after the hostname.
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-kanban}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    # AMQP and management UI stay on the internal network, see
    # docs/backend/RABBITMQ.md to reach the UI through an SSH tunnel.
    expose:
      - "5672"
      - "15672"
    restart: unless-stopped

volumes:
  backend-data:
  postgres-data:
  rabbitmq-data: