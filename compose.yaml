services:
  legacy_frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: legacy:frontend
    ports:
      - "8080:80"
    depends_on:
      legacy_backend:
        condition: service_healthy
    restart: unless-stopped

  legacy_backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: legacy:backend
    environment:
      - SQLITE_DB_LOCATION=/data/todo.db
    volumes:
      - backend-data:/data
    expose:
      - "3000"
    restart: unless-stopped

volumes:
  backend-data: